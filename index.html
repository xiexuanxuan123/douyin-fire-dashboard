<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>续火花 · 实时状态</title>
  <style>
    :root{--bg:#0b0d10;--panel:#14171b;--line:#282d33;--text:#f5f7f8;--muted:#8f98a3;--green:#44d17b;--amber:#f0b75a;--red:#ff6b6b;--blue:#68a7ff;--r:18px}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 86% -5%,#183225 0,transparent 32%),var(--bg)}
    button{font:inherit}.shell{width:min(100% - 28px,760px);margin:auto;padding:34px 0 48px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--green);margin-bottom:10px}.title{font-size:clamp(30px,7vw,46px);line-height:1.02;letter-spacing:-.045em;margin:0}.live-wrap{display:flex;align-items:center;gap:10px;padding-top:4px}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}.refresh{border:1px solid var(--line);background:#171b20;color:var(--text);border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer}.refresh:active{transform:translateY(1px)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px #44d17b18;animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.45}}
    .hero{border:1px solid var(--line);background:linear-gradient(135deg,#171b20,#101316);border-radius:var(--r);padding:22px;margin-bottom:14px}.hero-row{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}.state-big{font-size:25px;font-weight:700;letter-spacing:-.03em;margin:4px 0 7px}.sub{color:var(--muted);font-size:14px;line-height:1.55}.time{font:650 28px/1 ui-monospace,monospace;color:var(--amber)}
    .accounts{display:grid;gap:10px;margin:14px 0}.account{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px}.account-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.name{font-size:18px;font-weight:690}.planned{color:var(--muted);font:12px/1.2 ui-monospace,monospace;margin-top:5px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:650}.ok{color:var(--green);border-color:#44d17b45;background:#44d17b0d}.warn{color:var(--amber);border-color:#f0b75a45;background:#f0b75a0d}.bad{color:var(--red);border-color:#ff6b6b45;background:#ff6b6b0d}.unknown{color:var(--muted)}
    .meter{height:4px;background:#252a2f;border-radius:9px;margin:16px 0 13px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .35s ease}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact b{display:block;font-size:13px;margin-bottom:4px}.fact span{color:var(--muted);font-size:12px;line-height:1.35}.error{color:#ffaaa8!important}
    .action{position:sticky;bottom:12px;margin-top:18px;background:#0b0d10e8;backdrop-filter:blur(12px);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.run{width:100%;border:0;border-radius:15px;background:var(--green);color:#07150c;padding:17px 20px;font-weight:800;font-size:16px;cursor:pointer;transition:transform .15s,opacity .15s}.run:active{transform:translateY(1px) scale(.99)}.run:disabled{opacity:.5;cursor:wait}.notice{text-align:center;color:var(--muted);font-size:12px;margin-top:9px;min-height:18px}.footer{display:flex;justify-content:space-between;gap:14px;margin-top:16px;color:var(--muted);font-size:11px}.skeleton{opacity:.55}.fatal{border:1px solid #ff6b6b55;background:#2a1517;border-radius:var(--r);padding:18px;color:#ffd1d1;line-height:1.6}.hidden{display:none}
    @media(max-width:560px){.shell{width:min(100% - 20px,760px);padding-top:24px}.top{display:block}.live{margin-top:10px}.hero-row{grid-template-columns:1fr}.time{font-size:24px}.facts{grid-template-columns:1fr 1fr}.facts .fact:last-child{grid-column:1/-1}.footer{display:block;line-height:1.7}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">DOUYIN FIREKEEPER</div><h1 class="title">今日续火花</h1></div>
      <div class="live-wrap"><div class="live"><i class="dot"></i><span id="refreshLabel">状态连接中</span></div><button id="refreshButton" class="refresh" type="button">立即刷新</button></div>
    </header>

    <div id="fatal" class="fatal hidden"></div>
    <section id="content">
      <div class="hero">
        <div class="hero-row">
          <div><div class="sub">今日总状态</div><div id="overall" class="state-big skeleton">正在读取三个账号…</div><div id="runState" class="sub">连接GitHub实时状态</div></div>
          <div><div class="sub">下一次兜底</div><div id="nextTime" class="time">--:--</div></div>
        </div>
      </div>
      <div id="accounts" class="accounts"></div>
      <div class="action">
        <button id="runButton" class="run" type="button">一键启动全部任务</button>
        <div id="notice" class="notice">点击后服务器会立即创建正式发送任务</div>
      </div>
      <div class="footer"><span id="updated">状态尚未载入</span><span>前台每10秒自动刷新</span></div>
    </section>
  </main>
<script>
const OWNER='xiexuanxuan123', REPO='douyin-auto-fire', API='https://api.github.com';
const ACCOUNTS=['account1','account2','account3'];
const FALLBACKS=['00:30','00:47','01:17','01:43','02:07','02:41','03:23','04:07','04:47','05:29','06:13','07:01','07:43'];
let token='', lastRunStamp='', state=null, ticking=false, pendingRefresh=false;
const $=id=>document.getElementById(id);
function acquireToken(){const p=new URLSearchParams(location.hash.slice(1));token=p.get('token')||localStorage.getItem('douyin_dashboard_token')||'';if(token){localStorage.setItem('douyin_dashboard_token',token);history.replaceState(null,'',location.pathname+location.search)}}
async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).message||m}catch{}throw new Error(m)}return r.status===204?null:r.json()}
function bjParts(){const p=Object.fromEntries(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts().filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return p}
function nextFallback(allDone){if(allDone)return '已完成';const p=bjParts(), now=+p.hour*60+(+p.minute);const next=FALLBACKS.find(t=>{const[h,m]=t.split(':').map(Number);return h*60+m>now});return next||'明日 00:30'}
function fmtDate(v){if(!v)return '暂无';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(v))}catch{return '暂无'}}
function loginBadge(v){if(v==='valid')return ['登录正常','ok'];if(v==='expired')return ['登录失效','bad'];return ['等待检测','unknown']}
function accountCard(id,a={}){const t=a.today||{}, done=!!t.completed, count=t.success_count||0,total=t.total_count||0,pct=total?Math.min(100,count/total*100):0,[login,cls]=loginBadge(a.login_status);let task=done?'今日已完成':(`${count}/${total||'--'} 已完成`);let timing=done?('完成于 '+fmtDate(t.completed_at)):'等待任务';let reason=a.failure_reason?`<span class="error">${escapeHtml(a.failure_reason)}</span>`:timing;return `<article class="account"><div class="account-head"><div><div class="name">${a.name||id}</div><div class="planned">规定时间 ${a.planned_time||'--:--'}</div></div><div class="badge ${cls}">${login}</div></div><div class="meter"><i style="width:${pct}%"></i></div><div class="facts"><div class="fact"><b>${done?'已完成':'进行状态'}</b><span>${task}</span></div><div class="fact"><b>时间结果</b><span>${reason}</span></div><div class="fact"><b>最近检测</b><span>${fmtDate(a.last_checked_at)}</span></div></div></article>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadState(){const d=await api(`/repos/${OWNER}/${REPO}/contents/.state/dashboard-status.json?ref=main&t=${Date.now()}`);const raw=Uint8Array.from(atob(d.content.replace(/\n/g,'')),c=>c.charCodeAt(0));state=JSON.parse(new TextDecoder().decode(raw));render()}
function render(runs=[]){if(!state)return;const accounts=state.accounts||{},allDone=ACCOUNTS.every(id=>accounts[id]?.today?.completed);$('accounts').innerHTML=ACCOUNTS.map(id=>accountCard(id,accounts[id])).join('');$('overall').classList.remove('skeleton');$('overall').textContent=allDone?'三个账号今日全部完成':ACCOUNTS.filter(id=>accounts[id]?.today?.completed).length+'/3 个账号已完成';$('nextTime').textContent=nextFallback(allDone);$('updated').textContent='详情更新 '+fmtDate(state.updated_at)}
async function tick(force=false){if(!token)return;if(ticking){if(force)pendingRefresh=true;return}ticking=true;try{const data=await api(`/repos/${OWNER}/${REPO}/actions/workflows/send.yml/runs?per_page=8&t=${Date.now()}`);const runs=data.workflow_runs||[],active=runs.find(r=>['queued','in_progress','waiting','requested','pending'].includes(r.status)),latest=runs[0];const stamp=latest?latest.id+':'+latest.updated_at:'';if(!state||force||stamp!==lastRunStamp){lastRunStamp=stamp;await loadState()}if(active){$('runState').textContent=`任务正在${active.status==='queued'?'排队':'执行'} · 运行 ${active.id}`;$('runButton').disabled=true;$('runButton').textContent='任务正在运行'}else{$('runState').textContent=latest?`最近任务：${latest.conclusion==='success'?'成功':latest.conclusion||latest.status} · ${fmtDate(latest.updated_at)}`:'还没有运行记录';$('runButton').disabled=false;$('runButton').textContent='一键启动全部任务'}$('refreshLabel').textContent='已刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});$('fatal').classList.add('hidden');$('content').classList.remove('hidden')}catch(e){$('fatal').textContent=e.message.includes('Bad credentials')||e.message.includes('401')?'专属链接凭证已失效，请使用最新邮件中的入口。':'状态连接失败：'+e.message;$('fatal').classList.remove('hidden')}finally{ticking=false;if(pendingRefresh){pendingRefresh=false;tick(true)}}}
$('runButton').addEventListener('click',async()=>{const b=$('runButton');b.disabled=true;b.textContent='正在创建任务…';$('notice').textContent='请求已发出，请稍候';try{await api(`/repos/${OWNER}/${REPO}/actions/workflows/send.yml/dispatches`,{method:'POST',body:JSON.stringify({ref:'main',inputs:{dry_run:'false',account:'all',test_failure_account:'none'}})});$('notice').textContent='任务已创建，页面会自动跟踪运行状态';setTimeout(tick,800)}catch(e){$('notice').textContent='启动失败：'+e.message;b.disabled=false;b.textContent='重新启动'} });
$('refreshButton').addEventListener('click',()=>{lastRunStamp='';tick(true)});document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastRunStamp='';tick(true)}});acquireToken();if(!token){$('fatal').textContent='这个入口缺少专属凭证，请从邮件中的按钮重新打开。';$('fatal').classList.remove('hidden');$('content').classList.add('hidden')}else{tick();setInterval(()=>{if(!document.hidden)tick()},10000)}
</script>
</body>
</html>
